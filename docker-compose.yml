name: docs-minecraft-ccn

services:
  wiki:
    container_name: docs-minecraft-ccn
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/wiki}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    environment:
      WIKI_CHAT_API_URL: ${WIKI_CHAT_API_URL:-https://ccn.andyanh.id.vn/api/wiki/chat}
    ports:
      - "${WIKI_BIND_ADDRESS:-192.168.1.16}:${WIKI_HOST_PORT:-3010}:3000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/wiki/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s
